
services:
  postgres:
    image: postgres:16
    container_name: invoice-postgres
    environment:
      POSTGRES_DB: invoice_matcher
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

